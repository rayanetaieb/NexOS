---
# Séquence d'installation NexOS (dérivée de calamares-settings-debian, sans dépôt APT sur le support).
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - nexos-bootloader-config
  - grubcfg
  - bootloader
  - packages
  - nexos-cleanup
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished
branding: nexos
prompt-install: true
dont-chroot: false
