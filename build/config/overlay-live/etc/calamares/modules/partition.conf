---
# Partition système EFI : réutilise celle de Windows quand elle existe (installation « à côté »).
# Windows crée souvent une partition EFI de 100 Mo : shim + GRUB de NexOS y tiennent (≈ 5 Mo).
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
# Aucun choix présélectionné : avec Windows sur le disque, l'utilisateur choisit lui-même
# « Installer à côté » (et jamais « Effacer » par erreur).
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: true
