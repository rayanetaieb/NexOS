# NexOS — menu de démarrage (lu par update-grub / grub-mkconfig)
GRUB_DISTRIBUTOR="NexOS"
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_THEME=/usr/share/grub/themes/nexos/theme.txt
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3"
# Entrées « mode de récupération » conservées : réparation sans système graphique (docs/RECOVERY.md)
GRUB_DISABLE_RECOVERY=false
