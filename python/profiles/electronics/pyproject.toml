[project]
name = "nexos-profile-electronics"
version = "0.2.0"
description = "Électronique et instrumentation : série, USB, VISA, signal, microcontrôleurs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyserial>=3.5",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "pyusb>=1.2",
    "numpy>=2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pyqtgraph>=0.13",
    "PySide6-Essentials>=6.8",
    "esptool>=4.8",
    "mpremote>=1.24",
    "pymodbus>=3.7",
    "pytest>=8",
]

[tool.uv]
package = false
