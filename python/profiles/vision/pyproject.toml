[project]
name = "nexos-profile-vision"
version = "0.2.0"
description = "Vision par ordinateur : OpenCV, Pillow, Ultralytics YOLO"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opencv-python>=4.10",
    "pillow>=11",
    "ultralytics>=8.3",
    "torch>=2.5",
    "torchvision>=0.20",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "pytest>=8",
]

[tool.uv]
package = false
