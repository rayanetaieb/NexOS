[project]
name = "nexos-profile-quality"
version = "0.3.0"
description = "Tests et qualité du code : pytest, couverture, Hypothesis, Ruff, mypy, pre-commit, tox"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "tox>=4.18",
]

[tool.uv]
package = false
