[project]
name = "nexos-profile-ai"
version = "0.2.0"
description = "IA et machine learning (CPU) : PyTorch, TensorFlow/Keras, scikit-learn, XGBoost, ONNX"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.5",
    "tensorflow>=2.18",
    "keras>=3.6",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.1",
    "numpy>=2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "pytest>=8",
]

[tool.uv]
package = false
