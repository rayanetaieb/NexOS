[project]
name = "nexos-profile-appdev"
version = "0.2.0"
description = "Développement d'applications : Kivy, KivyMD, PySide6, tests, qualité, distribution"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kivy>=2.3",
    "kivymd>=1.2",
    "PySide6-Essentials>=6.8",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "pyinstaller>=6.10",
    "pytest-qt>=4.4",
]

[tool.uv]
package = false
