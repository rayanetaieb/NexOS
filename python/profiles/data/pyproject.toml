[project]
name = "nexos-profile-data"
version = "0.3.0"
description = "Analyse de données : Pandas, Polars, DuckDB, PyArrow, Matplotlib, Seaborn, Plotly, OpenPyXL, JupyterLab"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.1",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "openpyxl>=3.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pytest>=8",
]

[tool.uv]
package = false
