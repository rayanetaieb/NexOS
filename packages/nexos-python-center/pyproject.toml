[project]
name = "nexos-python-center"
version = "0.2.0"
description = "Centre Python NexOS : profils verrouillés, projets, catalogue (moteur uv)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
test = ["pytest>=8"]

[project.scripts]
nexos-python = "nexos_python.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nexos_python"]
