[project]
name = "nexai"
version = "0.1.0"
description = "Assistant IA local, léger et désactivable de NexOS (moteur llama.cpp à la demande)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []            # cœur sans dépendance : stdlib uniquement

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
test = ["pytest>=8"]

[project.scripts]
nexai = "nexai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nexai"]
